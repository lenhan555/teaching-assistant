<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1A6B3A"/>
  <ellipse cx="640" cy="60" rx="400" ry="150" fill="#5CDB8F" opacity="0.12"/>
  <text x="640" y="92" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Section 4</text>
  <text x="640" y="130" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="34" font-weight="700" fill="#5CDB8F" text-anchor="middle">Summary</text>
  <!-- Summary table card -->
  <rect x="80" y="152" width="1120" height="260" rx="10" fill="#FFFFFF" opacity="0.15"/>
  <!-- Header row -->
  <rect x="80" y="152" width="1120" height="40" rx="8" fill="#2EAA5E"/>
  <rect x="80" y="176" width="1120" height="16" fill="#2EAA5E"/>
  <text x="160" y="178" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Type</text>
  <text x="360" y="178" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">ON clause?</text>
  <text x="540" y="178" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Typical use</text>
  <text x="860" y="178" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Watch out for</text>
  <!-- CROSS JOIN row -->
  <rect x="80" y="192" width="1120" height="60" fill="#FFFFFF" opacity="0.05"/>
  <text x="160" y="228" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">CROSS JOIN</text>
  <text x="360" y="228" font-family="Courier New, monospace" font-size="13" fill="#5CDB8F">No</text>
  <text x="540" y="222" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#FFFFFF">All combinations,</text>
  <text x="540" y="240" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#FFFFFF">test data, grids</text>
  <text x="860" y="228" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#FFFFFF">Row explosion on large tables</text>
  <!-- Self-Join row -->
  <rect x="80" y="252" width="1120" height="60" fill="#FFFFFF" opacity="0.08"/>
  <text x="160" y="288" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Self-Join</text>
  <text x="360" y="288" font-family="Courier New, monospace" font-size="13" fill="#5CDB8F">Yes</text>
  <text x="540" y="282" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#FFFFFF">Hierarchical data,</text>
  <text x="540" y="300" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#FFFFFF">comparisons</text>
  <text x="860" y="288" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#FFFFFF">Must use table aliases</text>
  <!-- Remember bullets -->
  <circle cx="100" cy="460" r="18" fill="#5CDB8F"/>
  <text x="100" y="466" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="14" fill="#1A6B3A" text-anchor="middle">→</text>
  <text x="132" y="464" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF">CROSS JOIN has no condition — every row meets every other row</text>
  <circle cx="100" cy="510" r="18" fill="#5CDB8F"/>
  <text x="100" y="516" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="14" fill="#1A6B3A" text-anchor="middle">→</text>
  <text x="132" y="514" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF">Self-Join is a technique — not its own JOIN type. Works with any JOIN.</text>
  <circle cx="100" cy="560" r="18" fill="#5CDB8F"/>
  <text x="100" y="566" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="14" fill="#1A6B3A" text-anchor="middle">→</text>
  <text x="132" y="564" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF">Use LEFT JOIN for self-referential hierarchy so top-level rows appear</text>
  <!-- Slide number -->
  <text x="1215" y="700" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#FFFFFF" opacity="0.4">23</text>
</svg>
