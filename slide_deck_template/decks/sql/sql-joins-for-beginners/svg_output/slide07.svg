<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1A6B3A"/>
  <ellipse cx="640" cy="60" rx="400" ry="180" fill="#5CDB8F" opacity="0.12"/>
  <!-- Headline -->
  <text x="640" y="90" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Section 1 —</text>
  <text x="640" y="128" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="36" font-weight="700" fill="#5CDB8F" text-anchor="middle">INNER JOIN</text>
  <!-- Venn diagram — no clipPath, use layered circles -->
  <!-- Left circle fill (light) -->
  <circle cx="520" cy="380" r="150" fill="#1A6B3A" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
  <!-- Right circle fill (light) -->
  <circle cx="760" cy="380" r="150" fill="#1A6B3A" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
  <!-- Overlap region approximated with ellipse -->
  <ellipse cx="640" cy="380" rx="58" ry="130" fill="#2EAA5E" opacity="0.9"/>
  <!-- Labels -->
  <text x="430" y="375" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Customers</text>
  <text x="430" y="395" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.7" text-anchor="middle">(left table)</text>
  <text x="850" y="375" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Orders</text>
  <text x="850" y="395" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.7" text-anchor="middle">(right table)</text>
  <text x="640" y="372" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Matched</text>
  <text x="640" y="390" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">rows only</text>
  <!-- Right panel bullets -->
  <circle cx="1000" cy="290" r="18" fill="#2EAA5E"/>
  <text x="1000" y="296" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">→</text>
  <text x="1030" y="294" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">Intersection only — no extras</text>
  <circle cx="1000" cy="348" r="18" fill="#2EAA5E"/>
  <text x="1000" y="354" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">→</text>
  <text x="1030" y="352" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">Unmatched rows silently dropped</text>
  <circle cx="1000" cy="406" r="18" fill="#2EAA5E"/>
  <text x="1000" y="412" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">→</text>
  <text x="1030" y="410" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">Most commonly used JOIN type</text>
  <circle cx="1000" cy="464" r="18" fill="#2EAA5E"/>
  <text x="1000" y="470" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">→</text>
  <text x="1030" y="468" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">Use when: you need confirmed pairs</text>
  <text x="640" y="600" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="14" font-weight="400" fill="#5CDB8F" text-anchor="middle">Think: only the intersection of two circles in a Venn diagram</text>
  <text x="1215" y="700" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#FFFFFF" opacity="0.4">07</text>
</svg>
