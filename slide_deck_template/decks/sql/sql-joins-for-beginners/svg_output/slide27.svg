<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1A6B3A"/>
  <!-- Warning badge -->
  <circle cx="640" cy="68" r="28" fill="#CC3333"/>
  <text x="640" y="76" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="640" y="125" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Watch Out —</text>
  <text x="640" y="160" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="26" font-weight="700" fill="#CC3333" text-anchor="middle">Ambiguous Column Names</text>
  <!-- WRONG panel -->
  <rect x="60" y="185" width="340" height="340" rx="8" fill="#000000" opacity="0.3"/>
  <rect x="60" y="185" width="340" height="30" rx="8" fill="#CC3333"/>
  <rect x="60" y="200" width="340" height="15" fill="#CC3333"/>
  <text x="230" y="206" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">✗  WRONG</text>
  <text x="78" y="238" font-family="Courier New, monospace" font-size="11" fill="#FFFFFF" opacity="0.7">-- Which CustomerID?</text>
  <text x="78" y="258" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5CDB8F">SELECT</text>
  <text x="134" y="258" font-family="Courier New, monospace" font-size="11" fill="#CC3333" font-weight="700"> CustomerID,</text>
  <text x="78" y="276" font-family="Courier New, monospace" font-size="11" fill="#FFFFFF">       Name, Amount</text>
  <text x="78" y="296" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5CDB8F">FROM</text>
  <text x="122" y="296" font-family="Courier New, monospace" font-size="11" fill="#FFFFFF">   Customers</text>
  <text x="78" y="316" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5CDB8F">INNER JOIN</text>
  <text x="166" y="316" font-family="Courier New, monospace" font-size="11" fill="#FFFFFF"> Orders</text>
  <text x="78" y="336" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5CDB8F">  ON</text>
  <text x="108" y="336" font-family="Courier New, monospace" font-size="11" fill="#FFFFFF"> Customers.CustomerID</text>
  <text x="78" y="354" font-family="Courier New, monospace" font-size="11" fill="#FFFFFF">   = Orders.CustomerID;</text>
  <text x="78" y="388" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" fill="#CC3333">Error: ambiguous column 'CustomerID'</text>
  <text x="78" y="408" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7">SQL does not know which table</text>
  <text x="78" y="428" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7">the bare column name refers to</text>
  <!-- CORRECT panel -->
  <rect x="460" y="185" width="350" height="340" rx="8" fill="#000000" opacity="0.3"/>
  <rect x="460" y="185" width="350" height="30" rx="8" fill="#2EAA5E"/>
  <rect x="460" y="200" width="350" height="15" fill="#2EAA5E"/>
  <text x="635" y="206" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓  CORRECT</text>
  <text x="478" y="238" font-family="Courier New, monospace" font-size="11" fill="#FFFFFF" opacity="0.7">-- Prefix with table name</text>
  <text x="478" y="258" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5CDB8F">SELECT</text>
  <text x="534" y="258" font-family="Courier New, monospace" font-size="11" fill="#5CDB8F"> Customers.CustomerID,</text>
  <text x="478" y="276" font-family="Courier New, monospace" font-size="11" fill="#5CDB8F">       Customers.Name,</text>
  <text x="478" y="294" font-family="Courier New, monospace" font-size="11" fill="#5CDB8F">       Orders.Amount</text>
  <text x="478" y="314" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5CDB8F">FROM</text>
  <text x="522" y="314" font-family="Courier New, monospace" font-size="11" fill="#FFFFFF">   Customers</text>
  <text x="478" y="334" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5CDB8F">INNER JOIN</text>
  <text x="566" y="334" font-family="Courier New, monospace" font-size="11" fill="#FFFFFF"> Orders ON ...</text>
  <text x="478" y="380" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" fill="#5CDB8F">Works! Each column fully qualified</text>
  <!-- BEST PRACTICE panel -->
  <rect x="870" y="185" width="350" height="340" rx="8" fill="#000000" opacity="0.3"/>
  <rect x="870" y="185" width="350" height="30" rx="8" fill="#2EAA5E"/>
  <rect x="870" y="200" width="350" height="15" fill="#2EAA5E"/>
  <text x="1045" y="206" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">★  BEST PRACTICE</text>
  <text x="888" y="238" font-family="Courier New, monospace" font-size="11" fill="#FFFFFF" opacity="0.7">-- Use short aliases</text>
  <text x="888" y="258" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5CDB8F">SELECT</text>
  <text x="944" y="258" font-family="Courier New, monospace" font-size="11" fill="#5CDB8F"> c.CustomerID,</text>
  <text x="888" y="276" font-family="Courier New, monospace" font-size="11" fill="#5CDB8F">       c.Name, o.Amount</text>
  <text x="888" y="296" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5CDB8F">FROM</text>
  <text x="932" y="296" font-family="Courier New, monospace" font-size="11" fill="#FFFFFF">   Customers </text>
  <text x="1072" y="296" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5CDB8F">AS c</text>
  <text x="888" y="316" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5CDB8F">INNER JOIN</text>
  <text x="976" y="316" font-family="Courier New, monospace" font-size="11" fill="#FFFFFF"> Orders </text>
  <text x="1060" y="316" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5CDB8F">AS o</text>
  <text x="888" y="336" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5CDB8F">  ON</text>
  <text x="918" y="336" font-family="Courier New, monospace" font-size="11" fill="#FFFFFF"> c.CustomerID = o.CustomerID;</text>
  <text x="888" y="380" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" fill="#5CDB8F">Clean, unambiguous, readable</text>
  <!-- Slide number -->
  <text x="1215" y="700" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#FFFFFF" opacity="0.4">27</text>
</svg>
