<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1A6B3A"/>
  <ellipse cx="640" cy="60" rx="400" ry="180" fill="#5CDB8F" opacity="0.12"/>
  <!-- Headline -->
  <text x="640" y="95" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">In-Class</text>
  <text x="640" y="133" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="32" font-weight="700" fill="#5CDB8F" text-anchor="middle">Practice: INNER JOIN</text>
  <!-- Exercise 1 card -->
  <rect x="80" y="160" width="540" height="220" rx="12" fill="#FFFFFF" opacity="0.18"/>
  <text x="110" y="195" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="14" font-weight="700" fill="#5CDB8F">Exercise 1 — Warm-up</text>
  <text x="110" y="222" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF">Write a query that returns each customer's</text>
  <text x="110" y="244" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF">Name and the Amount they spent.</text>
  <text x="110" y="266" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF">Only include customers who have at least</text>
  <text x="110" y="288" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF">one order.</text>
  <text x="110" y="320" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#5CDB8F">Hint: INNER JOIN Orders ON …</text>
  <text x="110" y="340" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#5CDB8F">Start with SELECT, FROM Customers, then JOIN</text>
  <!-- Exercise 2 card -->
  <rect x="80" y="400" width="540" height="180" rx="12" fill="#FFFFFF" opacity="0.18"/>
  <text x="110" y="435" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="14" font-weight="700" fill="#5CDB8F">Exercise 2 — Stretch</text>
  <text x="110" y="462" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF">Modify Exercise 1 to also include the</text>
  <text x="110" y="484" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF">Product column.</text>
  <text x="110" y="506" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF">Sort the results by Amount descending.</text>
  <text x="110" y="540" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#5CDB8F">Hint: add ORDER BY Orders.Amount DESC</text>
  <!-- Expected output -->
  <text x="700" y="180" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Expected output (Exercise 1):</text>
  <rect x="700" y="192" width="480" height="150" rx="8" fill="#FFFFFF" opacity="0.15"/>
  <text x="720" y="218" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#5CDB8F">Name      Amount</text>
  <line x1="720" y1="226" x2="1160" y2="226" stroke="#5CDB8F" stroke-width="1" opacity="0.5"/>
  <text x="720" y="248" font-family="Courier New, monospace" font-size="13" fill="#FFFFFF">Alice     1200</text>
  <text x="720" y="270" font-family="Courier New, monospace" font-size="13" fill="#FFFFFF">Bob       800</text>
  <text x="720" y="292" font-family="Courier New, monospace" font-size="13" fill="#FFFFFF">Alice     25</text>
  <text x="720" y="320" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7">3 rows returned — Carol and Dan excluded</text>
  <!-- Hint bottom -->
  <text x="640" y="650" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="400" fill="#5CDB8F" text-anchor="middle" font-style="italic">Raise your hand when you have the correct output for Exercise 1</text>
  <!-- Slide number -->
  <text x="1215" y="700" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#FFFFFF" opacity="0.4">09</text>
</svg>
