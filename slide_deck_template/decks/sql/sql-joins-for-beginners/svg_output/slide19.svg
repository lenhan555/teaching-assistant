<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1A6B3A"/>
  <ellipse cx="640" cy="60" rx="400" ry="150" fill="#5CDB8F" opacity="0.12"/>
  <!-- Left panel headline -->
  <text x="60" y="100" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Section 4 —</text>
  <text x="60" y="138" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="34" font-weight="700" fill="#5CDB8F">CROSS JOIN</text>
  <line x1="60" y1="155" x2="500" y2="155" stroke="#2EAA5E" stroke-width="1.5"/>
  <text x="60" y="188" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">• Cartesian product: every row in A</text>
  <text x="60" y="210" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">  paired with every row in B</text>
  <text x="60" y="234" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">• No ON condition needed</text>
  <text x="60" y="258" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">• Result rows = A × B</text>
  <text x="60" y="282" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">• Our example: 4 customers × 4 orders = 16 rows</text>
  <text x="60" y="315" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#5CDB8F">Use cases (rare but valid):</text>
  <circle cx="80" cy="345" r="18" fill="#2EAA5E"/>
  <text x="80" y="351" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">→</text>
  <text x="110" y="350" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#FFFFFF">All size × color product variants</text>
  <circle cx="80" cy="380" r="18" fill="#2EAA5E"/>
  <text x="80" y="386" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">→</text>
  <text x="110" y="385" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#FFFFFF">Generating test data matrices</text>
  <circle cx="80" cy="415" r="18" fill="#2EAA5E"/>
  <text x="80" y="421" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">→</text>
  <text x="110" y="420" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#FFFFFF">Calendar grids (all dates × all employees)</text>
  <!-- Warning -->
  <rect x="60" y="460" width="460" height="60" rx="8" fill="#E89C20" opacity="0.2"/>
  <rect x="60" y="460" width="5" height="60" rx="4" fill="#E89C20"/>
  <text x="80" y="486" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#E89C20">Warning:</text>
  <text x="80" y="505" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.9">1,000 × 1,000 rows = 1,000,000 results! Use with caution.</text>
  <!-- Right stat cards -->
  <rect x="660" y="130" width="540" height="130" rx="10" fill="#FFFFFF" opacity="0.12"/>
  <text x="930" y="185" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">No ON clause needed</text>
  <text x="930" y="210" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Every row meets every other row</text>
  <rect x="660" y="280" width="540" height="130" rx="10" fill="#FFFFFF" opacity="0.12"/>
  <text x="930" y="335" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="38" font-weight="700" fill="#5CDB8F" text-anchor="middle">Rows = A × B</text>
  <text x="930" y="368" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8" text-anchor="middle">4 customers × 4 orders = 16 rows</text>
  <!-- Slide number -->
  <text x="1215" y="700" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#FFFFFF" opacity="0.4">19</text>
</svg>
