<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1A6B3A"/>
  <ellipse cx="640" cy="60" rx="400" ry="180" fill="#5CDB8F" opacity="0.12"/>
  <!-- Headline left-aligned -->
  <text x="80" y="95" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">LEFT JOIN —</text>
  <text x="80" y="133" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="32" font-weight="700" fill="#5CDB8F">Worked Example</text>
  <!-- Code block left -->
  <rect x="80" y="155" width="520" height="200" rx="8" fill="#000000" opacity="0.3" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>
  <text x="104" y="183" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#5CDB8F">SELECT</text>
  <text x="178" y="183" font-family="Courier New, monospace" font-size="13" fill="#FFFFFF"> Customers.Name, Orders.Product,</text>
  <text x="104" y="204" font-family="Courier New, monospace" font-size="13" fill="#FFFFFF">       Orders.Amount</text>
  <text x="104" y="228" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#5CDB8F">FROM</text>
  <text x="154" y="228" font-family="Courier New, monospace" font-size="13" fill="#FFFFFF">   Customers</text>
  <text x="104" y="251" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#5CDB8F">LEFT JOIN</text>
  <text x="196" y="251" font-family="Courier New, monospace" font-size="13" fill="#FFFFFF"> Orders</text>
  <text x="104" y="274" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#5CDB8F">  ON</text>
  <text x="134" y="274" font-family="Courier New, monospace" font-size="13" fill="#FFFFFF"> Customers.CustomerID = Orders.CustomerID;</text>
  <text x="80" y="390" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#5CDB8F">Key insight:</text>
  <text x="80" y="415" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF">Carol &amp; Dan appear with NULL — LEFT JOIN</text>
  <text x="80" y="437" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" fill="#FFFFFF">preserved them even without matching orders.</text>
  <!-- Right panel result table -->
  <text x="660" y="155" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Result (5 rows — notice Carol &amp; Dan):</text>
  <rect x="660" y="165" width="560" height="30" rx="4" fill="#2EAA5E"/>
  <text x="676" y="185" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Name</text>
  <text x="800" y="185" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Product</text>
  <text x="980" y="185" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Amount</text>
  <rect x="660" y="195" width="560" height="28" fill="#FFFFFF" opacity="0.1"/>
  <text x="676" y="214" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">Alice</text>
  <text x="800" y="214" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">Laptop</text>
  <text x="980" y="214" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">1200</text>
  <rect x="660" y="223" width="560" height="28" fill="#FFFFFF" opacity="0.05"/>
  <text x="676" y="242" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">Alice</text>
  <text x="800" y="242" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">Mouse</text>
  <text x="980" y="242" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">25</text>
  <rect x="660" y="251" width="560" height="28" fill="#FFFFFF" opacity="0.1"/>
  <text x="676" y="270" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">Bob</text>
  <text x="800" y="270" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">Phone</text>
  <text x="980" y="270" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">800</text>
  <!-- Carol row - highlighted NULL -->
  <rect x="660" y="279" width="560" height="28" fill="#5CDB8F" opacity="0.25"/>
  <text x="676" y="298" font-family="Courier New, monospace" font-size="12" fill="#5CDB8F" font-weight="700">Carol</text>
  <text x="800" y="298" font-family="Courier New, monospace" font-size="12" fill="#CC3333" font-weight="700">NULL</text>
  <text x="980" y="298" font-family="Courier New, monospace" font-size="12" fill="#CC3333" font-weight="700">NULL</text>
  <!-- Dan row - highlighted NULL -->
  <rect x="660" y="307" width="560" height="28" fill="#5CDB8F" opacity="0.15"/>
  <text x="676" y="326" font-family="Courier New, monospace" font-size="12" fill="#5CDB8F" font-weight="700">Dan</text>
  <text x="800" y="326" font-family="Courier New, monospace" font-size="12" fill="#CC3333" font-weight="700">NULL</text>
  <text x="980" y="326" font-family="Courier New, monospace" font-size="12" fill="#CC3333" font-weight="700">NULL</text>
  <!-- annotation arrow -->
  <line x1="1220" y1="312" x2="1220" y2="260" stroke="#5CDB8F" stroke-width="1.5"/>
  <text x="1225" y="295" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" fill="#5CDB8F">← Preserved</text>
  <text x="1225" y="310" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" fill="#5CDB8F">   by LEFT JOIN</text>
  <!-- Slide number -->
  <text x="1215" y="700" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#FFFFFF" opacity="0.4">11</text>
</svg>
