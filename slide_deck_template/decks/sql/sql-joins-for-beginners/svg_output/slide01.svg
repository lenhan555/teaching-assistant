<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bg01" cx="50%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#5CDB8F"/>
      <stop offset="100%" stop-color="#1A6B3A"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg01)"/>
  <!-- Soft glow top-right -->
  <ellipse cx="1050" cy="120" rx="280" ry="180" fill="#5CDB8F" opacity="0.15"/>
  <!-- Frosted card left panel -->
  <rect x="60" y="100" width="480" height="520" rx="16" fill="#FFFFFF" opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
  <!-- Card content -->
  <text x="110" y="170" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">SQL Training Series</text>
  <text x="110" y="200" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0.7">Session 3 of 6</text>
  <text x="110" y="225" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" opacity="0.6">Prerequisite: Basic SELECT &amp; WHERE</text>
  <!-- Decorative divider inside card -->
  <line x1="110" y1="245" x2="500" y2="245" stroke="#5CDB8F" stroke-width="1" opacity="0.5"/>
  <text x="110" y="290" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0.8">What you will learn:</text>
  <text x="110" y="320" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" opacity="0.75">• INNER, LEFT, RIGHT, FULL OUTER JOIN</text>
  <text x="110" y="345" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" opacity="0.75">• CROSS JOIN &amp; Self-Join</text>
  <text x="110" y="370" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" opacity="0.75">• Multiple JOINs across 3+ tables</text>
  <text x="110" y="395" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" opacity="0.75">• Common mistakes &amp; best practices</text>
  <!-- Right panel headline -->
  <text x="590" y="280" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="80" font-weight="900" fill="#FFFFFF">SQL</text>
  <text x="590" y="370" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="64" font-weight="900" fill="#5CDB8F">Joins</text>
  <text x="590" y="450" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="48" font-weight="900" fill="#5CDB8F">for Beginners</text>
  <text x="590" y="510" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" opacity="0.8">Combine data from multiple tables —</text>
  <text x="590" y="534" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" opacity="0.8">the most essential skill in SQL</text>
  <!-- Decorative gem shapes -->
  <rect x="1140" y="640" width="28" height="28" rx="4" fill="#2EAA5E" opacity="0.6" transform="rotate(45 1154 654)"/>
  <rect x="1175" y="655" width="16" height="16" rx="2" fill="#5CDB8F" opacity="0.4" transform="rotate(45 1183 663)"/>
  <!-- Slide number -->
  <text x="1215" y="700" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#FFFFFF" opacity="0.4">01</text>
</svg>
