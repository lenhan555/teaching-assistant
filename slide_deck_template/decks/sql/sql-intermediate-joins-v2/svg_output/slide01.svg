<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="90%" fx="50%" fy="15%">
      <stop offset="0%" stop-color="#5CDB8F"/>
      <stop offset="100%" stop-color="#1A6B3A"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- Atmosphere glow large -->
  <ellipse cx="640" cy="144" rx="300" ry="220" fill="#5CDB8F" opacity="0.22"/>
  <!-- Atmosphere glow small offset right -->
  <ellipse cx="832" cy="72" rx="180" ry="130" fill="#5CDB8F" opacity="0.15"/>
  <!-- Left frosted glass card -->
  <rect x="60" y="60" width="480" height="600" rx="16" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
  <!-- Logo circle -->
  <circle cx="160" cy="152" r="30" fill="#2EAA5E"/>
  <text x="160" y="158" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">SQL</text>
  <!-- Session badge text -->
  <text x="202" y="145" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">SQL Training · Intermediate</text>
  <text x="202" y="165" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" opacity="0.75">Advanced data querying with JOINs</text>
  <!-- Divider -->
  <line x1="100" y1="194" x2="500" y2="194" stroke="#5CDB8F" stroke-width="1" opacity="0.5"/>
  <!-- Subtitle -->
  <text x="100" y="234" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Mastering Every JOIN Type</text>
  <text x="100" y="260" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">for Real-World Queries</text>
  <!-- Session tags -->
  <text x="100" y="318" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0.8">6 JOIN types · Subquery rewrites</text>
  <text x="100" y="340" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0.8">Performance optimization</text>
  <!-- Audience badge chip -->
  <rect x="100" y="392" width="140" height="28" rx="14" fill="#2EAA5E" opacity="0.85"/>
  <text x="170" y="411" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Intermediate Level</text>
  <rect x="252" y="392" width="100" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.2"/>
  <text x="302" y="411" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">SQL Joins</text>
  <!-- Right panel display headline -->
  <text x="600" y="330" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="80" font-weight="900" fill="#FFFFFF">SQL</text>
  <text x="600" y="430" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="80" font-weight="900" fill="#5CDB8F">Joins</text>
  <!-- Right subtitle -->
  <text x="600" y="475" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" opacity="0.85">Master every JOIN for production queries</text>
  <!-- Decorative glow top-right -->
  <ellipse cx="1200" cy="80" rx="120" ry="90" fill="#5CDB8F" opacity="0.15"/>
  <!-- Slide number -->
  <text x="1215" y="700" font-family="Poppins, sans-serif" font-size="11" text-anchor="end" fill="#FFFFFF">1</text>
</svg>
