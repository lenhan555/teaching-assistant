<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- White background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Left column headline: "JOIN" near-black + "Performance" green-mid -->
  <text x="60" y="138" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="36" font-weight="700" fill="#1A1A2E">JOIN </text>
  <text x="155" y="138" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="36" font-weight="700" fill="#2EAA5E">Performance</text>
  <!-- Divider -->
  <line x1="60" y1="152" x2="500" y2="152" stroke="#2EAA5E" stroke-width="1.5"/>
  <!-- Framing text -->
  <text x="60" y="175" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="400" fill="#4A4A6A">Five rules for queries the optimizer can execute efficiently</text>

  <!-- Sargable callout box with left accent bar -->
  <!-- Outer rounded rect -->
  <rect x="60" y="210" width="420" height="66" rx="12" fill="#FFFFFF" stroke="#5CDB8F" stroke-width="1.5"/>
  <!-- Left accent bar (4pt wide, full height of callout) -->
  <rect x="60" y="210" width="4" height="66" rx="2" fill="#2EAA5E"/>
  <!-- Callout text -->
  <text x="78" y="234" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#1A1A2E" font-style="italic">Sargable condition = the optimizer can use an index.</text>
  <text x="78" y="252" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#1A1A2E" font-style="italic">Non-sargable = full scan on every row.</text>
  <text x="78" y="270" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="600" fill="#2EAA5E">ON YEAR(date) = 2024 is non-sargable — rewrite as a range.</text>

  <!-- ── Row 1: Index join columns (y-center=185) ── -->
  <circle cx="562" cy="185" r="22" fill="#2EAA5E"/>
  <!-- Database cylinder icon (simple) -->
  <ellipse cx="562" cy="174" rx="10" ry="4" fill="#FFFFFF"/>
  <rect x="552" y="174" width="20" height="14" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="562" cy="188" rx="10" ry="4" fill="#FFFFFF"/>
  <text x="596" y="181" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="600" fill="#1A1A2E">Index join columns</text>
  <text x="596" y="197" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">Foreign keys without an index cause full-table scans on every join</text>

  <!-- ── Row 2: No functions in ON clause (y-center=253) ── -->
  <circle cx="562" cy="253" r="22" fill="#2EAA5E"/>
  <!-- Ban/circle-X icon -->
  <circle cx="562" cy="253" r="11" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="554" y1="245" x2="570" y2="261" stroke="#FFFFFF" stroke-width="2"/>
  <text x="596" y="249" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="600" fill="#1A1A2E">No functions in ON clause</text>
  <text x="596" y="265" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">ON YEAR(date) = 2024 kills index use; use a range condition instead</text>

  <!-- ── Row 3: Filter early (y-center=321) ── -->
  <circle cx="562" cy="321" r="22" fill="#2EAA5E"/>
  <!-- Filter funnel icon -->
  <polygon points="551,311 573,311 568,319 568,330 556,330 556,319" fill="#FFFFFF"/>
  <text x="596" y="317" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="600" fill="#1A1A2E">Filter early</text>
  <text x="596" y="333" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">WHERE conditions that shrink rows before joining reduce join workload</text>

  <!-- ── Row 4: Prefer INNER JOIN (y-center=389) ── -->
  <circle cx="562" cy="389" r="22" fill="#2EAA5E"/>
  <!-- Sort arrows icon -->
  <line x1="553" y1="383" x2="571" y2="383" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="553" y1="391" x2="568" y2="391" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="553" y1="399" x2="563" y2="399" stroke="#FFFFFF" stroke-width="2"/>
  <text x="596" y="385" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="600" fill="#1A1A2E">Prefer INNER JOIN</text>
  <text x="596" y="401" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">Optimizer has more freedom to reorder; avoid unnecessary OUTER JOINs</text>

  <!-- ── Row 5: Always EXPLAIN (y-center=457) ── -->
  <circle cx="562" cy="457" r="22" fill="#2EAA5E"/>
  <!-- Magnifying glass icon -->
  <circle cx="559" cy="453" r="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="565" y1="459" x2="573" y2="467" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="596" y="453" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="600" fill="#1A1A2E">Always EXPLAIN</text>
  <text x="596" y="469" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">EXPLAIN ANALYZE reveals index scan vs sequential scan — run it every time</text>

  <!-- Slide number -->
  <text x="1215" y="700" font-family="Poppins, sans-serif" font-size="11" text-anchor="end" fill="#4A4A6A">8</text>
</svg>
