<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- White background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Two-tone headline top-left -->
  <text x="60" y="118" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="36" font-weight="700" fill="#1A1A2E">Special </text>
  <text x="222" y="118" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="36" font-weight="700" fill="#2EAA5E">JOINs</text>
  <!-- Short divider (Column 1 width only) -->
  <line x1="60" y1="132" x2="420" y2="132" stroke="#2EAA5E" stroke-width="1.5"/>

  <!-- ══ Column 1: CROSS JOIN (x=60–420) ══ -->
  <text x="60" y="172" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="600" fill="#1A1A2E">CROSS JOIN</text>
  <text x="60" y="192" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">Result = Table A rows × Table B rows.</text>
  <text x="60" y="206" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">No ON clause needed.</text>
  <text x="60" y="230" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">Use for: product matrices, calendar grids,</text>
  <text x="60" y="244" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">test data generation.</text>
  <text x="60" y="268" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A" font-style="italic">Risk: 1,000 × 1,000 = 1,000,000 rows.</text>
  <text x="60" y="282" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="600" fill="#2EAA5E">Always sanity-check row count first.</text>
  <!-- Code card Column 1 -->
  <rect x="60" y="302" width="360" height="44" rx="8" fill="#F4F4F8"/>
  <text x="76" y="320" font-family="Courier New, monospace" font-size="9" fill="#1A1A2E">SELECT * FROM products</text>
  <text x="76" y="336" font-family="Courier New, monospace" font-size="9" fill="#1A1A2E">CROSS JOIN colors;</text>

  <!-- ══ Column 2: Arrow (x=430–830, centered at 630) ══ -->
  <!-- Block right arrow shape centered at (630, 390) -->
  <polygon points="540,372 700,372 700,356 740,390 700,424 700,408 540,408" fill="#2EAA5E"/>
  <!-- Glow -->
  <polygon points="540,372 700,372 700,356 740,390 700,424 700,408 540,408" fill="#2EAA5E" opacity="0.20"/>
  <text x="630" y="460" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A" text-anchor="middle">vs.</text>

  <!-- ══ Column 3: SELF JOIN (x=840–1220) ══ -->
  <text x="840" y="172" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="13" font-weight="600" fill="#1A1A2E">SELF JOIN</text>
  <text x="840" y="192" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">Same table, two aliases. No special keyword.</text>
  <text x="840" y="216" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">Use for: hierarchies (employee → manager),</text>
  <text x="840" y="230" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">duplicate detection, row comparisons.</text>
  <text x="840" y="254" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A" font-style="italic">Use LEFT JOIN variant to keep top-level</text>
  <text x="840" y="268" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A" font-style="italic">rows (employees with no manager).</text>
  <!-- Code card Column 3 -->
  <rect x="840" y="302" width="360" height="68" rx="8" fill="#F4F4F8"/>
  <text x="856" y="320" font-family="Courier New, monospace" font-size="9" fill="#1A1A2E">SELECT e.name,</text>
  <text x="856" y="336" font-family="Courier New, monospace" font-size="9" fill="#1A1A2E">  m.name AS manager</text>
  <text x="856" y="352" font-family="Courier New, monospace" font-size="9" fill="#1A1A2E">FROM employees e</text>
  <text x="856" y="368" font-family="Courier New, monospace" font-size="9" fill="#1A1A2E">LEFT JOIN employees m ON e.manager_id = m.id;</text>

  <!-- Bottom tip callout -->
  <rect x="60" y="530" width="1160" height="44" rx="8" fill="#F4F4F8" stroke="#2EAA5E" stroke-width="1"/>
  <text x="80" y="549" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="600" fill="#1A1A2E">CROSS JOIN tip:</text>
  <text x="212" y="549" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="400" fill="#4A4A6A">Add a WHERE clause to filter the product — otherwise you generate every combination unconditionally.</text>
  <text x="80" y="565" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="600" fill="#1A1A2E">SELF JOIN tip:</text>
  <text x="207" y="565" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="400" fill="#4A4A6A">Always alias clearly (e for employee, m for manager) — ambiguous aliases cause subtle bugs.</text>

  <!-- Slide number -->
  <text x="1215" y="700" font-family="Poppins, sans-serif" font-size="11" text-anchor="end" fill="#4A4A6A">6</text>
</svg>
