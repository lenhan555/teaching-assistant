<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="90%" fx="50%" fy="15%">
      <stop offset="0%" stop-color="#5CDB8F"/>
      <stop offset="100%" stop-color="#1A6B3A"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- Atmosphere glow upper-center -->
  <ellipse cx="640" cy="108" rx="200" ry="150" fill="#5CDB8F" opacity="0.18"/>
  <!-- Decorative gem top-right -->
  <ellipse cx="1195" cy="76" rx="34" ry="26" fill="#5CDB8F" opacity="0.35"/>
  <ellipse cx="1195" cy="76" rx="20" ry="15" fill="#5CDB8F" opacity="0.5"/>
  <!-- Decorative gem bottom-left -->
  <ellipse cx="88" cy="650" rx="28" ry="20" fill="#5CDB8F" opacity="0.3"/>
  <ellipse cx="88" cy="650" rx="16" ry="12" fill="#5CDB8F" opacity="0.45"/>

  <!-- Headline centered -->
  <text x="640" y="120" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">In-Class Practice</text>
  <line x1="440" y1="136" x2="840" y2="136" stroke="#5CDB8F" stroke-width="1" opacity="0.4"/>

  <!-- ── Task 1: Easy (y=220) ── -->
  <!-- Difficulty badge: Easy = green-light fill, near-black text -->
  <rect x="200" y="210" width="64" height="22" rx="11" fill="#5CDB8F"/>
  <text x="232" y="225" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="9" font-weight="600" fill="#1A1A2E" text-anchor="middle">Easy</text>
  <!-- Task label -->
  <text x="278" y="224" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Task 1</text>
  <!-- Task description -->
  <text x="200" y="252" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" opacity="0.85">Write a LEFT JOIN returning all employees and their department names,</text>
  <text x="200" y="270" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" opacity="0.85">including employees with no department assigned.</text>

  <!-- Divider between tasks -->
  <line x1="200" y1="292" x2="1080" y2="292" stroke="#FFFFFF" stroke-width="0.5" opacity="0.2"/>

  <!-- ── Task 2: Medium (y=345) ── -->
  <!-- Difficulty badge: Medium = green-mid fill, white text -->
  <rect x="200" y="312" width="76" height="22" rx="11" fill="#2EAA5E"/>
  <text x="238" y="327" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">Medium</text>
  <!-- Task label -->
  <text x="290" y="326" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Task 2</text>
  <!-- Task description -->
  <text x="200" y="354" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" opacity="0.85">Find all customers who have never placed an order — no subqueries allowed.</text>
  <text x="200" y="372" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" opacity="0.75" font-style="italic">Hint: think about what NULL means on the right side of a LEFT JOIN.</text>

  <!-- Divider between tasks -->
  <line x1="200" y1="394" x2="1080" y2="394" stroke="#FFFFFF" stroke-width="0.5" opacity="0.2"/>

  <!-- ── Task 3: Hard (y=455) ── -->
  <!-- Difficulty badge: Hard = white fill, near-black text -->
  <rect x="200" y="414" width="64" height="22" rx="11" fill="#FFFFFF"/>
  <text x="232" y="429" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="9" font-weight="600" fill="#1A1A2E" text-anchor="middle">Hard</text>
  <!-- Task label -->
  <text x="278" y="428" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Task 3</text>
  <!-- Task description -->
  <text x="200" y="456" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" opacity="0.85">Rewrite this correlated subquery as a JOIN:</text>
  <!-- Task 3 code card -->
  <rect x="200" y="472" width="880" height="52" rx="8" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
  <text x="216" y="491" font-family="Courier New, monospace" font-size="10" fill="#FFFFFF">SELECT c.customer_name FROM customers c</text>
  <text x="216" y="509" font-family="Courier New, monospace" font-size="10" fill="#FFFFFF">WHERE (SELECT MAX(amount) FROM orders o WHERE o.customer_id = c.customer_id) &gt; 1000;</text>

  <!-- Slide number -->
  <text x="1215" y="700" font-family="Poppins, sans-serif" font-size="11" text-anchor="end" fill="#FFFFFF">9</text>
</svg>
