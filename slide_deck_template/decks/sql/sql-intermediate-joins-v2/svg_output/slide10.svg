<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- White background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Left column headline: "Session" near-black + "Summary" green-mid -->
  <text x="60" y="138" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="36" font-weight="700" fill="#1A1A2E">Session </text>
  <text x="232" y="138" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="36" font-weight="700" fill="#2EAA5E">Summary</text>
  <!-- Divider -->
  <line x1="60" y1="152" x2="500" y2="152" stroke="#2EAA5E" stroke-width="1.5"/>
  <!-- Framing text -->
  <text x="60" y="175" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="11" font-weight="400" fill="#4A4A6A">What we covered today.</text>

  <!-- Next Steps callout box (green-mid border, right-arrow badge) -->
  <rect x="60" y="200" width="420" height="152" rx="12" fill="#FFFFFF" stroke="#2EAA5E" stroke-width="1.5"/>
  <!-- Right-arrow badge inside callout (32pt circle) -->
  <circle cx="92" cy="276" r="16" fill="#2EAA5E"/>
  <!-- Arrow icon in badge -->
  <polyline points="82,276 100,276" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <polyline points="94,270 100,276 94,282" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <!-- Next steps label -->
  <text x="80" y="224" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="700" fill="#2EAA5E">Next Steps</text>
  <!-- Action text beside arrow badge -->
  <text x="118" y="268" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#1A1A2E">Complete take-home exercises 4–7</text>
  <text x="118" y="282" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#1A1A2E">in the assignment sheet.</text>
  <text x="118" y="304" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#1A1A2E">Practice EXPLAIN on your own database</text>
  <text x="118" y="318" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#1A1A2E">before the next session.</text>
  <text x="80" y="342" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="9" font-weight="400" fill="#4A4A6A">Next session: Window Functions and CTEs</text>

  <!-- ── Right column: 6 summary rows (40pt badges, 14pt gap) ── -->
  <!-- Row 1 (y-center=122) -->
  <circle cx="562" cy="122" r="20" fill="#2EAA5E"/>
  <polyline points="552,122 559,129 573,112" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="594" y="118" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="600" fill="#1A1A2E">INNER JOIN</text>
  <text x="594" y="134" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">Matched rows only; silent row drops are the number-one gotcha</text>

  <!-- Row 2 (y-center=180) -->
  <circle cx="562" cy="180" r="20" fill="#2EAA5E"/>
  <polyline points="552,180 559,187 573,170" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="594" y="176" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="600" fill="#1A1A2E">LEFT JOIN</text>
  <text x="594" y="192" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">Preserve the left table; move filters to ON clause, not WHERE</text>

  <!-- Row 3 (y-center=238) -->
  <circle cx="562" cy="238" r="20" fill="#2EAA5E"/>
  <polyline points="552,238 559,245 573,228" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="594" y="234" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="600" fill="#1A1A2E">FULL OUTER JOIN</text>
  <text x="594" y="250" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">Reconciliation and discrepancy detection across two datasets</text>

  <!-- Row 4 (y-center=296) -->
  <circle cx="562" cy="296" r="20" fill="#2EAA5E"/>
  <polyline points="552,296 559,303 573,286" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="594" y="292" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="600" fill="#1A1A2E">CROSS / SELF JOIN</text>
  <text x="594" y="308" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">Cartesian products and same-table hierarchy queries</text>

  <!-- Row 5 (y-center=354) -->
  <circle cx="562" cy="354" r="20" fill="#2EAA5E"/>
  <polyline points="552,354 559,361 573,344" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="594" y="350" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="600" fill="#1A1A2E">Subquery rewrites</text>
  <text x="594" y="366" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">NOT IN → LEFT JOIN + IS NULL; EXISTS → INNER JOIN + DISTINCT</text>

  <!-- Row 6 (y-center=412) -->
  <circle cx="562" cy="412" r="20" fill="#2EAA5E"/>
  <polyline points="552,412 559,419 573,402" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="594" y="408" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="12" font-weight="600" fill="#1A1A2E">Performance</text>
  <text x="594" y="424" font-family="Poppins, DM Sans, Inter, sans-serif" font-size="10" font-weight="400" fill="#4A4A6A">Index join columns; write sargable conditions; run EXPLAIN ANALYZE</text>

  <!-- Slide number -->
  <text x="1215" y="700" font-family="Poppins, sans-serif" font-size="11" text-anchor="end" fill="#4A4A6A">10</text>
</svg>
